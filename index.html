<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weble — Web BLE Debugger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300..700&display=swap" rel="stylesheet">
<script src="app.js"></script>
</head>
<body>
<div id="app-root">Loading…</div>
<script>
  fetch('./app-part1.html').then(r=>r.text()).then(h1=>{
    fetch('./app-part2.html').then(r=>r.text()).then(h2=>{
      fetch('./app-part3.html').then(r=>r.text()).then(h3=>{
        document.open();
        document.write(h1+h2+h3);
        document.close();
      });
    });
  });
</script>
</body>
</html>
